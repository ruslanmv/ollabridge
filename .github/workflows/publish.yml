name: Build & Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: write   # upload assets to the GitHub release
  id-token: write   # required for OIDC / trusted publishing

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      # Guard against shipping an empty / mispackaged wheel (this is what broke
      # 0.1.0: metadata + console script, but no importable `ollabridge`
      # package). Install the freshly built wheel — NOT editable, NOT from PyPI
      # — into a clean venv and prove the package imports and the CLI loads.
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/whl-smoke
          /tmp/whl-smoke/bin/pip install --upgrade pip
          /tmp/whl-smoke/bin/pip install "$(ls dist/*.whl)"
          /tmp/whl-smoke/bin/python -c "import ollabridge, ollabridge.cli.main; print('import OK:', ollabridge.__file__)"
          /tmp/whl-smoke/bin/ollabridge --help > /dev/null
          echo "✓ wheel is importable and the CLI loads"

      - name: Upload artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Persist artifacts for publish job
        uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/ollabridge/
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
