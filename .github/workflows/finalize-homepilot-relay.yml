name: Finalize HomePilot Relay Once

on:
  push:
    branches: [feature/homepilot-remote-image-generation]
    paths:
      - '.github/workflows/finalize-homepilot-relay.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/homepilot-remote-image-generation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Black
        run: python -m pip install black

      - name: Restore legacy lines and format additive files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ollabridge/cloud/bridge_manager.py')
          text = path.read_text()
          text = text.replace(
              '"device_id": self.status.device_id if False else self.device_id,',
              '"device_id": self.device_id,',
          )
          text = text.replace(
              '# the device was unlinked or its access revoked in',
              '# the device was unlinked or its access was revoked in',
          )
          block = '''"capabilities": [
                            "chat",
                            "models",
                            "media_fetch",
                            HOMEPILOT_IMAGE_RELAY_CAPABILITY,
                        ],'''
          text = text.replace(block, '"capabilities": ["chat", "models", "media_fetch"],', 1)
          marker = '''                    catalog_manifest = self._build_catalog_manifest()'''
          text = text.replace(
              marker,
              '                    hello["capabilities"].append(HOMEPILOT_IMAGE_RELAY_CAPABILITY)\n' + marker,
              1,
          )
          block2 = '''"capabilities": [
                "chat",
                "models",
                "media_fetch",
                HOMEPILOT_IMAGE_RELAY_CAPABILITY,
            ],'''
          text = text.replace(block2, '"capabilities": ["chat", "models", "media_fetch"],', 1)
          marker2 = '''        await ws.send(json.dumps(hello))'''
          text = text.replace(
              marker2,
              '        hello["capabilities"].append(HOMEPILOT_IMAGE_RELAY_CAPABILITY)\n' + marker2,
              1,
          )
          path.write_text(text)
          PY
          black --fast src/ollabridge/cloud/homepilot_image_relay.py tests/test_homepilot_cloud_image_relay.py
          git rm .github/workflows/finalize-homepilot-relay.yml
          git add src/ollabridge/cloud/bridge_manager.py src/ollabridge/cloud/homepilot_image_relay.py tests/test_homepilot_cloud_image_relay.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Finalize HomePilot cloud image relay"
          git push origin HEAD:feature/homepilot-remote-image-generation
