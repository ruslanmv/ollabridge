name: Rebuild HomePilot Relay Once

on:
  push:
    branches: [feature/homepilot-remote-image-generation]
    paths:
      - '.github/workflows/rebuild-homepilot-relay.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/homepilot-remote-image-generation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild legacy module from master and add narrow hooks
        run: |
          git fetch origin master
          git show origin/master:src/ollabridge/cloud/bridge_manager.py > src/ollabridge/cloud/bridge_manager.py
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ollabridge/cloud/bridge_manager.py')
          text = path.read_text()

          import_anchor = '''from ollabridge.cloud.device_config import (
              CloudDeviceCredentials,
              load_cloud_device_credentials,
              save_cloud_device_credentials,
          )
          '''
          import_add = import_anchor + '''from ollabridge.cloud.homepilot_image_relay import (
              CAPABILITY_OP as HOMEPILOT_IMAGE_CAPABILITY_OP,
              GENERATE_OP as HOMEPILOT_IMAGE_GENERATE_OP,
              RELAY_CAPABILITY as HOMEPILOT_IMAGE_RELAY_CAPABILITY,
              capability as homepilot_image_capability,
              generate as homepilot_image_generate,
          )
          '''
          assert text.count(import_anchor) == 1
          text = text.replace(import_anchor, import_add, 1)

          dispatch_anchor = '''            elif op == "media_fetch":
              result = await self._fetch_media(payload)
              response = {"type": "res", "id": req_id, "ok": True, "data": result}
          '''
          dispatch_add = dispatch_anchor + '''            elif op == HOMEPILOT_IMAGE_CAPABILITY_OP:
              result = await homepilot_image_capability()
              response = {"type": "res", "id": req_id, "ok": True, "data": result}
          elif op == HOMEPILOT_IMAGE_GENERATE_OP:
              result = await homepilot_image_generate(payload)
              response = {"type": "res", "id": req_id, "ok": True, "data": result}
          '''
          assert text.count(dispatch_anchor) == 1
          text = text.replace(dispatch_anchor, dispatch_add, 1)

          catalog_anchor = '                    catalog_manifest = self._build_catalog_manifest()'
          assert text.count(catalog_anchor) == 1
          text = text.replace(
              catalog_anchor,
              '                    hello["capabilities"].append(HOMEPILOT_IMAGE_RELAY_CAPABILITY)\n' + catalog_anchor,
              1,
          )

          function_anchor = '    async def _send_model_update(self, ws: Any) -> list[str]:'
          idx = text.index(function_anchor)
          head, tail = text[:idx], text[idx:]
          send_anchor = '        await ws.send(json.dumps(hello))'
          assert tail.count(send_anchor) >= 1
          tail = tail.replace(
              send_anchor,
              '        hello["capabilities"].append(HOMEPILOT_IMAGE_RELAY_CAPABILITY)\n' + send_anchor,
              1,
          )
          path.write_text(head + tail)
          PY
          python -m py_compile src/ollabridge/cloud/bridge_manager.py
          python -m pip install black
          black --fast src/ollabridge/cloud/homepilot_image_relay.py tests/test_homepilot_cloud_image_relay.py
          git rm .github/workflows/rebuild-homepilot-relay.yml
          git add src/ollabridge/cloud/bridge_manager.py src/ollabridge/cloud/homepilot_image_relay.py tests/test_homepilot_cloud_image_relay.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Rebuild HomePilot image relay hooks cleanly"
          git push origin HEAD:feature/homepilot-remote-image-generation
