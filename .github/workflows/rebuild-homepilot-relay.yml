name: Rebuild HomePilot Relay Once

on:
  push:
    branches: [feature/homepilot-remote-image-generation]
    paths:
      - '.github/workflows/rebuild-homepilot-relay.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/homepilot-remote-image-generation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild legacy module from master and add narrow hooks
        run: |
          git fetch origin master
          git show origin/master:src/ollabridge/cloud/bridge_manager.py > src/ollabridge/cloud/bridge_manager.py
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ollabridge/cloud/bridge_manager.py')
          lines = path.read_text().splitlines()

          start = lines.index('from ollabridge.cloud.device_config import (')
          end = start + 1
          while lines[end] != ')':
              end += 1
          imports = [
              'from ollabridge.cloud.homepilot_image_relay import (',
              '    CAPABILITY_OP as HOMEPILOT_IMAGE_CAPABILITY_OP,',
              '    GENERATE_OP as HOMEPILOT_IMAGE_GENERATE_OP,',
              '    RELAY_CAPABILITY as HOMEPILOT_IMAGE_RELAY_CAPABILITY,',
              '    capability as homepilot_image_capability,',
              '    generate as homepilot_image_generate,',
              ')',
          ]
          lines[end + 1:end + 1] = imports

          media_idx = next(i for i, line in enumerate(lines) if line.strip() == 'elif op == "media_fetch":')
          response_idx = next(
              i for i in range(media_idx + 1, media_idx + 5)
              if 'response = {"type": "res", "id": req_id, "ok": True, "data": result}' in lines[i]
          )
          indent = lines[media_idx][: len(lines[media_idx]) - len(lines[media_idx].lstrip())]
          child = indent + '    '
          relay_lines = [
              indent + 'elif op == HOMEPILOT_IMAGE_CAPABILITY_OP:',
              child + 'result = await homepilot_image_capability()',
              child + 'response = {"type": "res", "id": req_id, "ok": True, "data": result}',
              indent + 'elif op == HOMEPILOT_IMAGE_GENERATE_OP:',
              child + 'result = await homepilot_image_generate(payload)',
              child + 'response = {"type": "res", "id": req_id, "ok": True, "data": result}',
          ]
          lines[response_idx + 1:response_idx + 1] = relay_lines

          catalog_idx = next(i for i, line in enumerate(lines) if 'catalog_manifest = self._build_catalog_manifest()' in line)
          indent = lines[catalog_idx][: len(lines[catalog_idx]) - len(lines[catalog_idx].lstrip())]
          lines.insert(catalog_idx, indent + 'hello["capabilities"].append(HOMEPILOT_IMAGE_RELAY_CAPABILITY)')

          fn_idx = next(i for i, line in enumerate(lines) if line.strip().startswith('async def _send_model_update('))
          send_idx = next(i for i in range(fn_idx + 1, len(lines)) if lines[i].strip() == 'await ws.send(json.dumps(hello))')
          indent = lines[send_idx][: len(lines[send_idx]) - len(lines[send_idx].lstrip())]
          lines.insert(send_idx, indent + 'hello["capabilities"].append(HOMEPILOT_IMAGE_RELAY_CAPABILITY)')

          path.write_text('\n'.join(lines) + '\n')
          PY
          python -m py_compile src/ollabridge/cloud/bridge_manager.py
          python -m pip install black
          black --fast src/ollabridge/cloud/homepilot_image_relay.py tests/test_homepilot_cloud_image_relay.py
          git rm .github/workflows/rebuild-homepilot-relay.yml
          git add src/ollabridge/cloud/bridge_manager.py src/ollabridge/cloud/homepilot_image_relay.py tests/test_homepilot_cloud_image_relay.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Rebuild HomePilot image relay hooks cleanly"
          git push origin HEAD:feature/homepilot-remote-image-generation
