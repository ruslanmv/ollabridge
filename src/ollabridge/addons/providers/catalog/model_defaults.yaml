# ─────────────────────────────────────────────────────────────
# OllaBridge — Model defaults
# ─────────────────────────────────────────────────────────────
# Which model a source should default to, and which of a provider's
# models cost nothing to run.
#
# Two jobs:
#   1. Default: a source added through the Sources UI with no explicit
#      default model gets the best entry here that its live catalog
#      actually offers. No model id is hard-coded in application code —
#      a provider that retires one is corrected in this file, or not at
#      all when the match is by family prefix.
#   2. Badging: live discovery marks a model `free: true` when it matches
#      the `free` block, so the settings picker can show and filter the
#      no-cost ones.
#
# Per kind:
#   free       — models that cost nothing. `models` is an ordered list of
#                exact ids, `prefixes`/`suffixes` match families.
#   preferred  — ranking for the default when the provider has no free
#                tier, or when the best default is not the cheapest.
#                Falls back to the `free` block when absent, which is why
#                the free-tier providers below declare only `free`.
#
# This file never replaces live discovery — the provider's own catalog is
# the source of truth for what exists and what this account may use. It
# only says which of those to prefer, and which are free.
# ─────────────────────────────────────────────────────────────

kinds:
  groq:
    free:
      # Preference order: small+fastest first, then larger, then multimodal.
      # Groq deprecated its Llama chat models (llama-3.3-70b-versatile,
      # llama-3.1-8b-instant), qwen/qwen3-32b, meta-llama/llama-4-scout-*
      # and moonshotai/kimi-k2-instruct-0905 during 2026; the gpt-oss
      # family is the migration target Groq itself recommends.
      models:
        - openai/gpt-oss-20b
        - openai/gpt-oss-120b
        - qwen/qwen3.6-27b
        - meta-llama/llama-4-maverick-17b-128e-instruct
        - groq/compound-mini
        - groq/compound
      # Anything under these namespaces is free-tier on Groq even when it
      # is newer than this file.
      prefixes:
        - openai/gpt-oss
        - groq/compound

  openrouter:
    free:
      # OpenRouter marks its free routes with a ``:free`` suffix.
      models:
        - openai/gpt-oss-20b:free
        - meta-llama/llama-3.3-70b-instruct:free
        - google/gemma-3-27b-it:free
        - deepseek/deepseek-chat:free
      suffixes:
        - ":free"

  gemini:
    free:
      models:
        - gemini-2.5-flash
        - gemini-2.5-flash-lite

  huggingface:
    free:
      # HF Inference Providers bills monthly free credits rather than
      # per-model, so every route is "free" until the credit runs out.
      models:
        - meta-llama/Llama-3.3-70B-Instruct
        - meta-llama/Llama-3.1-8B-Instruct
        - Qwen/Qwen2.5-72B-Instruct

  cerebras:
    free:
      models:
        - gpt-oss-120b
        - qwen-3-32b

  watsonx:
    # Nothing on watsonx.ai is free — every foundation model is billed per
    # token — so there is no `free` block and no model is ever badged free.
    #
    # The default is ranked by family rather than by exact id, because the
    # model list is per region, per plan and per account: only what the
    # live catalog offers can be chosen, and IBM revises the Granite
    # generations often enough that pinning one id guarantees it goes
    # stale. Granite first (IBM's own models, present on every watsonx
    # plan and the cheapest tier), then the third-party chat families.
    preferred:
      prefixes:
        - ibm/granite-4
        - ibm/granite-3
        - ibm/granite
        - mistralai/mistral-large
        - mistralai/mistral
        - meta-llama/llama-4
        - meta-llama/llama-3
