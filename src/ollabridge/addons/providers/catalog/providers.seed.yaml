# ─────────────────────────────────────────────────────────────
# OllaBridge Cloud — Provider Seed Catalog
# ─────────────────────────────────────────────────────────────
# Single source of truth for all provider registrations.
#
# Categories:
#   free       — no cost, subject to rate limits
#   free-flex  — aggregator with free model options
#   free-lab   — experimental / OSS inference
#   cheap      — low cost, not guaranteed free
#   local      — private OllamaBridge nodes
#
# Tiers:
#   main       — preferred routing targets
#   secondary  — overflow / fallback targets
# ─────────────────────────────────────────────────────────────

providers:
  # ── Free Primary ──────────────────────────────────────────

  - id: gemini-free
    name: Google Gemini API
    kind: gemini
    enabled: true
    tier: main
    category: free
    priority: 100
    weight: 30
    base_url: https://generativelanguage.googleapis.com
    credential_env: GEMINI_API_KEY
    tags: [free, general, large-context, testing]
    notes: "Best free overall test provider"

  - id: groq-free
    name: Groq API
    kind: groq
    enabled: true
    tier: main
    category: free
    priority: 95
    weight: 25
    # Same base URL the OpenAI SDK is pointed at for Groq. A bare
    # https://api.groq.com also works — the adapter normalizes both.
    base_url: https://api.groq.com/openai/v1
    credential_env: GROQ_API_KEY
    tags: [free, fast, testing]
    # Concrete ids this provider serves, so the router can send
    # "openai/gpt-oss-20b" to Groq — the id names neither "groq" nor a vendor
    # the heuristic would otherwise resolve here. Groq retired its Llama chat
    # models during 2026 and points migrations at the gpt-oss family.
    models:
      - openai/gpt-oss-20b
      - openai/gpt-oss-120b
      - qwen/qwen3.6-27b
      - meta-llama/llama-4-maverick-17b-128e-instruct
      - groq/compound
      - groq/compound-mini
    notes: "Fastest provider for latency benchmarks"

  - id: openrouter-free
    name: OpenRouter
    kind: openrouter
    enabled: true
    tier: main
    category: free-flex
    priority: 90
    weight: 20
    base_url: https://openrouter.ai/api/v1
    credential_env: OPENROUTER_API_KEY
    tags: [free, aggregator, flexible, testing]
    notes: "Best for many free model experiments"

  # ── Free Secondary ────────────────────────────────────────

  - id: huggingface-free
    name: Hugging Face Inference Providers
    kind: huggingface
    enabled: true
    tier: main
    category: free-flex
    priority: 85
    weight: 20
    base_url: https://router.huggingface.co
    # HF_TOKEN is the canonical name HF uses in its own docs and SDKs.
    # HUGGINGFACE_API_KEY is kept as a fallback for older deployments.
    credential_env: HF_TOKEN
    tags: [free, free-credit, aggregator, multimodal, vision, tools, oss]
    notes: "OpenAI-compatible router across many upstream providers (Together, Novita, Groq, Fireworks, DeepInfra, ...). Uses HF monthly credits."

  # ── Cheap Secondary ───────────────────────────────────────

  - id: deepseek-cheap
    name: DeepSeek API
    kind: deepseek
    enabled: true
    tier: secondary
    category: cheap
    priority: 85
    weight: 15
    base_url: https://api.deepseek.com
    credential_env: DEEPSEEK_API_KEY
    tags: [cheap, reasoning, testing]
    notes: "Cheap alternative, not guaranteed free"

  # ── Local OllamaBridge Nodes ──────────────────────────────

  - id: ollama-node-01
    name: OllamaBridge Node 01
    kind: ollama_bridge
    # Disabled: the addon adapter is not wired to the relay. Real relay
    # routing is handled by the gateway's RelayHub. Leaving this enabled
    # made it intercept traffic and return a stub. See ollama_bridge.py.
    enabled: false
    tier: main
    category: local
    priority: 110
    weight: 40
    base_url: ws://node-01.internal
    credential_env: null
    tags: [local, private, ollama, testing]
    notes: "Local private node — highest priority"

  - id: ollama-node-02
    name: OllamaBridge Node 02
    kind: ollama_bridge
    enabled: false
    tier: main
    category: local
    priority: 110
    weight: 40
    base_url: ws://node-02.internal
    credential_env: null
    tags: [local, private, ollama, testing]
    notes: "Local private node — highest priority"
